<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGINT OPS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <img class="site-header__logo" src="images/shield.svg" alt="Shield logo">
        <h1 class="site-header__title">SIGINT OPS</h1>
        <p class="status-badge">
            <span class="status-badge__dot"></span>SECURE &bull; ONLINE
        </p>
    </header>

    <main class="dashboard">

        <section class="overview">
            <div class="radar" aria-hidden="true">
                <div class="radar__sweep"></div>
                <span class="radar__dot radar__dot--1"></span>
                <span class="radar__dot radar__dot--2"></span>
                <span class="radar__dot radar__dot--3"></span>
            </div>
            <div class="stats">
                <div class="stat">
                    <p class="stat__value">24</p>
                    <p class="stat__label">ACTIVE SIGNALS</p>
                </div>
                <div class="stat">
                    <p class="stat__value">07</p>
                    <p class="stat__label">PRIORITY ALERTS</p>
                </div>
            </div>
        </section>

        <section class="actions">
            <button class="action-btn" type="button">
                <img src="images/zap.svg" alt="" aria-hidden="true">New Brief
            </button>
            <button class="action-btn" type="button">
                <img src="images/code.svg" alt="" aria-hidden="true">Decode
            </button>
            <button class="action-btn" type="button">
                <img src="images/rocket.svg" alt="" aria-hidden="true">Request Drone
            </button>
        </section>

        <section class="missions">

            <article class="mission-card mission-card--critical">
                <div class="mission-card__top">
                    <span class="badge badge--critical">CRITICAL</span>
                    <span class="mission-card__status">In Progress</span>
                </div>
                <h2 class="mission-card__name">Operation Nightfall</h2>
                <div class="progress" style="--progress: 65%">
                    <div class="progress__track"><div class="progress__fill"></div></div>
                    <span class="progress__value">65%</span>
                </div>
            </article>

            <article class="mission-card mission-card--high">
                <div class="mission-card__top">
                    <span class="badge badge--high">HIGH</span>
                    <span class="mission-card__status">Analyzing</span>
                </div>
                <h2 class="mission-card__name">Signal Intercept Alpha</h2>
                <div class="progress" style="--progress: 40%">
                    <div class="progress__track"><div class="progress__fill"></div></div>
                    <span class="progress__value">40%</span>
                </div>
            </article>

            <article class="mission-card mission-card--medium">
                <div class="mission-card__top">
                    <span class="badge badge--medium">MEDIUM</span>
                    <span class="mission-card__status">Pending</span>
                </div>
                <h2 class="mission-card__name">Asset Recovery</h2>
                <div class="progress" style="--progress: 15%">
                    <div class="progress__track"><div class="progress__fill"></div></div>
                    <span class="progress__value">15%</span>
                </div>
            </article>

            <article class="mission-card mission-card--high">
                <div class="mission-card__top">
                    <span class="badge badge--high">HIGH</span>
                    <span class="mission-card__status">Active</span>
                </div>
                <h2 class="mission-card__name">Cyber Defense Grid</h2>
                <div class="progress" style="--progress: 80%">
                    <div class="progress__track"><div class="progress__fill"></div></div>
                    <span class="progress__value">80%</span>
                </div>
            </article>

        </section>

        <section class="alert-bar" role="alert">
            <p class="alert-bar__text">THREAT DETECTED</p>
        </section>

    </main>

    <nav class="bottom-nav">
        <a class="bottom-nav__item bottom-nav__item--active" href="#">
            <img src="images/activity.svg" alt="" aria-hidden="true">
            <span>Dashboard</span>
        </a>
        <a class="bottom-nav__item" href="#">
            <img src="images/radio.svg" alt="" aria-hidden="true">
            <span>Feed</span>
        </a>
        <a class="bottom-nav__item" href="#">
            <img src="images/file-text.svg" alt="" aria-hidden="true">
            <span>Brief</span>
        </a>
        <button class="help-btn" type="button" aria-label="Help">?</button>
    </nav>

</body>

</html>
